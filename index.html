<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://b.top4top.io/p_3031g7hp40.jpg">
    <link rel="shortcut icon" href="https://b.top4top.io/p_3031g7hp40.jpg" type="image/x-icon" />
    <meta property="og:description" content="ini adalah info pribadi salma">
    <meta property="og:url" content="https://salma-autis.vercel.app/">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
    
    <title>Info Pribadi Salma Cik</title>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fas fa-skull"></i></div>
            <span class="logo-text">SalmaHub</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active"><i class="fas fa-user-secret"></i><span>Profile</span></a>
            <a href="https://wa.me/6288286272458" class="nav-item"><i class="fab fa-whatsapp"></i><span>Contact</span></a>
        </nav>
        <div class="sidebar-footer">© 2024 Salma Private</div>
    </div>

    <button class="sidebar-toggle" id="sb-toggle"><i class="fas fa-bars"></i></button>

    <div class="page-wrap">
        <div id="main-content" style="display:none;"></div>
        <footer>
            © 2024 Personal Information
        </footer>
    </div>

    <script>
        const sbToggle = document.getElementById('sb-toggle');
        const sidebar = document.getElementById('sidebar');
        if(sbToggle) {
            sbToggle.onclick = () => {
                sidebar.classList.toggle('open');
                sbToggle.innerHTML = sidebar.classList.contains('open') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            };
        }

        (function(){
            const canvas = document.getElementById('bg-canvas');
            if(!canvas) return;
            const renderer = new THREE.WebGLRenderer({canvas, alpha:true});
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(1500*3);
            for(let i=0;i<1500*3;i++) pos[i]=(Math.random()-.5)*100;
            geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({color:0xff6b6b,size:0.12,transparent:true,opacity:0.8}));
            scene.add(stars);
            let mx=0,my=0;
            window.addEventListener('mousemove',e=>{mx=(e.clientX/window.innerWidth-.5)*.3;my=(e.clientY/window.innerHeight-.5)*.3});
            window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
            (function animate(){requestAnimationFrame(animate);stars.rotation.y+=0.0003;stars.rotation.x+=0.0001;camera.position.x+=(mx-camera.position.x)*.03;camera.position.y+=(-my-camera.position.y)*.03;camera.lookAt(scene.position);renderer.render(scene,camera)})();
        })();
    </script>
</body>
</html>
